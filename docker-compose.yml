# 可选：Docker Compose + Caddy
# 原生部署请优先使用 deploy/install-ubuntu.sh。
#
# IP 测试：.env 中 SITE_ADDRESS=:80, HTTP_PORT=8080
# 域名 HTTPS：.env 中 SITE_ADDRESS=你的域名, HTTP_PORT=80, HTTPS_PORT=443

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
